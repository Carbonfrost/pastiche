name: secrets
secrets:
  - name: token
    title: API Token
    description: Description
    comment: Comment
    links:
      - rel: example
        href: https://example.com/go
    exec:
      command: op read op://vault/api/token
  - name: apiKey
    file:
      path: /etc/pastiche/api.key
      preserveTrailingWhitespace: true
servers:
  - name: production
    baseUrl: https://example.sh/
    secrets:
      - name: password
        file:
          path: /etc/pastiche/password
